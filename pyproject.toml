[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kanji-test"
version = "0.1.0"
description = "Kanken-ordered kanji quiz with mistake weighting (meaning-only answers)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kanji-quiz = "kanji_test.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
kanji_test = ["data/*.json"]
